<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-logo">Control<span>Escolar</span></div>
        <p class="login-subtitle">Crea tu cuenta nueva</p>
        <div id="regMsg" class="login-error" style="display:none;"></div>
        <div class="mb-3">
            <label class="form-label">Nombre completo</label>
            <input type="text" id="nombre" class="form-control" placeholder="Tu nombre">
        </div>
        <div class="mb-3">
            <label class="form-label">Correo electrónico</label>
            <input type="email" id="email" class="form-control" placeholder="correo@ejemplo.com">
        </div>
        <div class="mb-4">
            <label class="form-label">Contraseña (mín. 6 caracteres)</label>
            <input type="password" id="password" class="form-control" placeholder="••••••">
        </div>
        <button id="btnReg" class="btn-login">Crear cuenta</button>
        <div class="text-center mt-3">
            <a href="login.html" class="link-back">¿Ya tienes cuenta? Inicia sesión</a>
        </div>
    </div>
</div>
<script>
document.getElementById('btnReg').addEventListener('click', async () => {
    const nombre   = document.getElementById('nombre').value.trim();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    const msgBox   = document.getElementById('regMsg');
    msgBox.style.display = 'none';
    if (!nombre||!email||!password) {
        msgBox.className='login-error'; msgBox.textContent='Completa todos los campos';
        msgBox.style.display='block'; return;
    }
    const btn = document.getElementById('btnReg');
    btn.textContent='Registrando...'; btn.disabled=true;
    try {
        const r = await fetch('registro.php', { method:'POST',
                  headers:{'Content-Type':'application/json'},
                  body: JSON.stringify({nombre,email,password}) });
        const d = await r.json();
        if (d.exito) {
            msgBox.className='admin-notif admin-notif--success';
            msgBox.textContent=d.mensaje+' Redirigiendo...';
            msgBox.style.display='block';
            setTimeout(()=> window.location.href='login.html', 1500);
        } else {
            msgBox.className='login-error'; msgBox.textContent=d.mensaje;
            msgBox.style.display='block';
        }
    } catch(e) { msgBox.className='login-error'; msgBox.textContent='Error de red'; msgBox.style.display='block'; }
    finally    { btn.textContent='Crear cuenta'; btn.disabled=false; }
});
</script>
</body>
</html>
