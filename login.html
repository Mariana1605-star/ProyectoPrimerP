<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-logo">Proyecto<span>Carrusel</span></div>
        <p class="login-subtitle">Inicia sesión en tu cuenta</p>
        <div id="loginError" class="login-error" style="display:none;"></div>
        <div class="mb-3">
            <label class="form-label">Correo electrónico</label>
            <input type="email" id="email" class="form-control" placeholder="correo@ejemplo.com">
        </div>
        <div class="mb-4">
            <label class="form-label">Contraseña</label>
            <input type="password" id="password" class="form-control" placeholder="••••••">
        </div>
        <button id="btnLogin" class="btn-login">Iniciar sesión</button>
        <div class="text-center mt-3">
            <a href="registro.html" class="link-back">¿Sin cuenta? Regístrate</a>
        </div>
    </div>
</div>
<script>
document.getElementById('btnLogin').addEventListener('click', async () => {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    const errBox   = document.getElementById('loginError');
    errBox.style.display = 'none';
    if (!email || !password) { errBox.textContent='Completa todos los campos'; errBox.style.display='block'; return; }
    const btn = document.getElementById('btnLogin');
    btn.textContent = 'Entrando...'; btn.disabled = true;
    try {
        const r  = await fetch('login.php', { method:'POST',
                   headers:{'Content-Type':'application/json'},
                   body: JSON.stringify({email,password}) });
        const d  = await r.json();
        if (d.exito) { window.location.href = 'dashboard.html'; }
        else { errBox.textContent = d.mensaje; errBox.style.display='block'; }
    } catch(e) { errBox.textContent='Error de red'; errBox.style.display='block'; }
    finally    { btn.textContent='Iniciar sesión'; btn.disabled=false; }
});
document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('btnLogin').click();
});
</script>
</body>
</html>
